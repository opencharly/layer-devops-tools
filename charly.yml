version: 2026.232.0520
devops-tools:
    candy:
        version: 2026.162.1430
        description: |
            provisions cloud and infra CLI tooling (AWS CLI v2, Scaleway CLI, OpenTofu, kubectx/kubens) plus JSON/sync/DNS utilities
            Installs the AWS CLI v2, the Scaleway CLI, OpenTofu, and the
            kubectx/kubens kubectl context switchers as standalone binaries under
            /usr/local/bin, alongside jq, rsync, unzip, and the per-distro DNS
            lookup tools (dig). Every tool lands at a fixed path and reports its
            version, so the composition is verifiable in a disposable container
            without any cloud account or live cluster.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
        package:
            - jq
            - rsync
            - unzip
        distro:
            arch:
                package:
                    - bind-tools
            debian:
                package:
                    - dnsutils
            fedora:
                package:
                    - bind-utils
            ubuntu:
                package:
                    - dnsutils
        plan:
            - run: download the AWS CLI v2 zip (the declarative download verb — content-addressed /tmp/downloads cache, atomic .part to mv rename, stage-user-correct cache mount)
              download: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
              extract: zip
              to: /tmp/awscli
              run_as: root
            - run: run the bundled aws install script
              command: |
                cd /tmp/awscli && ./aws/install
                rm -rf /tmp/awscli
              run_as: root
            - run: download the scaleway CLI binary (pinned release — the declarative download verb; the previous dynamic latest-API lookup is replaced by the deterministic pinned fallback URL)
              download: "https://github.com/scaleway/scaleway-cli/releases/download/v2.45.0/scaleway-cli_2.45.0_linux_amd64"
              extract: none
              to: /usr/local/bin/scw
              mode: "0755"
              run_as: root
            - run: download the kubectx script (the declarative download verb)
              download: "https://raw.githubusercontent.com/ahmetb/kubectx/master/kubectx"
              extract: none
              to: /usr/local/bin/kubectx
              mode: "0755"
              run_as: root
            - run: download the kubens script (the declarative download verb)
              download: "https://raw.githubusercontent.com/ahmetb/kubectx/master/kubens"
              extract: none
              to: /usr/local/bin/kubens
              mode: "0755"
              run_as: root
            - run: download the opentofu installer script (the declarative download verb)
              download: "https://get.opentofu.org/install-opentofu.sh"
              extract: none
              to: /tmp/install-opentofu.sh
              mode: "0755"
              run_as: root
            - run: run the opentofu installer
              command: |
                bash /tmp/install-opentofu.sh --install-method standalone
                rm -f /tmp/install-opentofu.sh
              run_as: root
            - check: the AWS CLI v2 binary is installed at /usr/local/bin/aws
              file:
                file: /usr/local/bin/aws
                exists: true
            - check: aws reports its own version string
              exit_status: 0
              stdout:
                - contains: aws-cli
              command: /usr/local/bin/aws --version
            - check: the Scaleway CLI binary is installed at /usr/local/bin/scw
              file:
                file: /usr/local/bin/scw
                exists: true
            - check: OpenTofu is installed and reports its version
              exit_status: 0
              command: /usr/local/bin/tofu version
            - check: the kubectx kubectl-context switcher script is installed
              file:
                file: /usr/local/bin/kubectx
                exists: true
            - check: the kubens kubectl-namespace switcher script is installed
              file:
                file: /usr/local/bin/kubens
                exists: true
            - check: jq is installed and reports its version
              exit_status: 0
              command: /usr/bin/jq --version
            - check: the dig DNS lookup tool resolves on PATH from the per-distro bind package
              exit_status: 0
              command: command -v dig
            - check: file=/usr/local/bin/tofu
              id: tofu-binary
              file:
                file: /usr/local/bin/tofu
                exists: true
            - check: file=/usr/bin/jq
              id: jq-binary
              file:
                file: /usr/bin/jq
                exists: true
            - check: command=/usr/local/bin/scw version
              id: scw-version
              exit_status: 0
              command: /usr/local/bin/scw version

devops-tools-skill:
    skill:
        name: devops-tools
        family: coder
        owner: devops-tools
        description: |-
            DevOps CLI tools: AWS CLI, Scaleway, kubectx/kubens, OpenTofu, wrangler, bind-utils, jq, rsync.
            Use when working with cloud infrastructure, DNS lookups, infrastructure-as-code, or DevOps tooling.
        content: |-
            # devops-tools -- cloud and infrastructure CLI tools
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `nodejs` |
            | Install files | `task:`, `package.json` |
            
            ## Packages
            
            - `bind-utils` (RPM) -- DNS lookup tools (dig, nslookup)
            - `jq` (RPM) -- JSON processor
            - `rsync` (RPM) -- file synchronization
            - `wrangler` (npm) -- Cloudflare Workers CLI
            
            ## Cross-distro coverage
            
            `rpm:` (Fedora) · `pac:` (Arch) · `deb:` (Debian/Ubuntu — `dnsutils` replaces `bind-utils`, `jq`, `rsync` identical). The cloud-CLI tools (AWS, Scaleway, kubectx/kubens, OpenTofu) are declarative download-verb binaries — distro-agnostic by construction, no per-package-manager work needed.
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-image:
              candy:
                - devops-tools
            ```
            
            ## Used In Boxes
            
            - (none currently enabled)
            
            ## Related Candies
            
            - `/charly-coder:nodejs` -- Node.js dependency for npm packages
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - AWS CLI, Scaleway CLI, or cloud provider tools
            - kubectx or kubens for Kubernetes context switching
            - OpenTofu or infrastructure-as-code
            - Cloudflare Wrangler
            - DNS tools (dig, nslookup) or jq/rsync in containers
            
            ## Author + Test References
            
            - `/charly-image:layer` — candy authoring reference (tasks, vars, env_provide, tests block syntax)
            - `/charly-check:check` — declarative testing framework for the `check:` block
